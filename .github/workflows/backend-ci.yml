name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [master]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mood_tracker
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/mood_tracker
      JWT_SECRET: ci-only-secret-that-is-at-least-sixty-four-characters-long-1234567890
      CORS_ORIGIN: http://localhost:3000

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
